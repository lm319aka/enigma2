[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma2"
version = "1.1.0"
description = "Enigma2 encryption and decryption module"
authors = [
    { name="r00st3r", email="s1llyr00st3r@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "chardet"
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["enigma2"]

[tool.setuptools.package-data]
"*" = ["LICENSE.txt"]